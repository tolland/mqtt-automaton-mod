---

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gradle-check
        name: Gradle spotlessCheck
        entry: ./gradlew spotlessCheck
        language: system
        pass_filenames: false
