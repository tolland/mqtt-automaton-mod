---

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gradle-check
        name: Gradle spotlessCheck
        entry: ./gradlew spotlessCheck
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
        - id: ruff
          args: [--fix]
          files: ^src-py/
        - id: ruff-format
          files: ^src-py/
