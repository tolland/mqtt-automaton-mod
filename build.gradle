import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
    id "fabric-loom" version "${loom_version}"
    id "com.diffplug.spotless" version "8.1.0"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

def ENV = System.getenv()

def mcUsername =
        System.getenv("MQTTBOT_USERNAME")
                ?: project.findProperty("bot_username")
                ?: "Player999"

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    flatDir { dirs 'libs' }

//    ivy {
//        url = "https://github.com/cabaletta/baritone/releases/download"
//        patternLayout {
//            artifact("v[revision]/[module]-[revision].jar")
//        }
//        metadataSources {
//            artifact() // no ivy.xml or pom
//        }
//    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    maven {
        name = 'tolland-wurst'
        url = uri("https://maven.pkg.github.com/tolland/Wurst7")
        credentials {
            username = System.getenv("GITHUB_ACTOR")
            password = System.getenv("GITHUB_TOKEN")
        }
    }
//    ivy {
//        url 'https://github.com/tolland/Wurst7/releases/download'
//        patternLayout {
//            artifact '[revision]/[module]-[revision](-[classifier]).[ext]'
//        }
//        metadataSources {
//            artifact()
//        }
//    }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.8:2025.09.14@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.yaml:snakeyaml:2.0'
    modImplementation "cabaletta:baritone-api-fabric:${baritone_version}"
    modImplementation "net.wurstclient:wurst-client:1.21.8-develop"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_api_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
    implementation "io.moquette:moquette-broker:0.17"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
// optional for JUnit 5 integration if you plan to use MockitoExtension
//    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"

}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mqttbot-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        username = "Mqtt-Bot"
    }
}

sourceSets {
