plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id "com.diffplug.spotless" version "8.1.0"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    flatDir { dirs 'libs' }

    ivy {
        url "https://github.com/cabaletta/baritone/releases/download"
        patternLayout {
            artifact("v[revision]/[module]-[revision].jar")
        }
        metadataSources {
            artifact() // no ivy.xml or pom
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mqttbot" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            programArgs(
//					"--username", "SandyFire",
                    "--quickPlaySingleplayer", "TestFabricModWorld1"
            )
        }
    }

}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation group: 'org.eclipse.paho', name: 'org.eclipse.paho.client.mqttv3', version: '1.2.5'
    implementation 'org.yaml:snakeyaml:2.0'
//    modCompileOnly name: "baritone-api-fabric", version: "1.15.0"
    modCompileOnly "cabaletta:baritone-api-fabric:1.15.0"
    modCompileOnly name: "Wurst-Client", version: "v7.51.2-MC1.21.8"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_api_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.21 uses Java 21.
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
//	from {
//		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
//	}
    from {
        configurations.compileClasspath.findAll {
            (it.name.endsWith('jar') && it.name.contains('org.eclipse.paho.client.mqttv3'))
        }
    }.collect {
        zipTree(it)
    }
}
