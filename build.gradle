}

compileJava.dependsOn spotlessApply

afterEvaluate {
    sourceSets {
//        gametest {
//            compileClasspath += sourceSets.main.compileClasspath
//
//            runtimeClasspath += sourceSets.main.runtimeClasspath
//        }
        "src-py" {
            java {
                srcDir "src-py"
            }
        }
    }

}
loom {

    accessWidenerPath = file("src/main/resources/mqttbot.accesswidener")

//    splitEnvironmentSourceSets()

    mods {
        "mqttbot" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            programArgs(
                    "--username", mcUsername as String,
//                    "--quickPlaySingleplayer", "TestFabricModWorld1"
                    "--quickPlayMultiplayer", "docker.lan:25565"
            )
        }
        clientGameTest {
            source sourceSets.gametest
        }
    }
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.21 uses Java 21.
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    from {
        configurations.compileClasspath.findAll {
            (it.name.endsWith('jar') && it.name.contains('org.eclipse.paho.client.mqttv3'))
        }
    }.collect {
        zipTree(it)
    }
}

spotless {
    java {
        removeUnusedImports()
        leadingSpacesToTabs()
        trimTrailingWhitespace()
        eclipse().configFile(file("codestyle/formatter.xml"))
    }
    json {
        target("src/**/*.json", "src/**/*.mcmeta")
        gson().indentWithSpaces(2).version("2.11.0")
    }
}

test {
    useJUnitPlatform()
}


tasks.register("runProductionClientGameTest", ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    // Whether to use XVFB to run the game, using a virtual framebuffer. This is useful for headless CI environments.
    // Defaults to true only on Linux and when the "CI" environment variable is set.
    // XVFB must be installed, on Debian-based systems you can install it with: `apt install xvfb`
    useXVFB = true
}

tasks.register("printGametestClasspath") {
    doLast {
        sourceSets.gametest.compileClasspath.each {
            println it
        }
    }
}


tasks.register("printMainClientClasspath") {
    doLast {
        sourceSets.main.compileClasspath.each {
            println it
        }
    }
}
