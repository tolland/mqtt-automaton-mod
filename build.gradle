}

import java.util.concurrent.TimeUnit

tasks.register('runClientWithTests') {
    group = 'fabric'
    description = 'Run client with pytest tests'

    doLast {
        // Start runClient in background
        def clientProcess = tasks.runClient.exec()

        try {
            // Give the client time to start and connect
            Thread.sleep(5000)

            // Run pytest
            def testProcess = new ProcessBuilder('pytest', '-v')
                    .inheritIO()
                    .start()

            def testExitCode = testProcess.waitFor()

            if (testExitCode != 0) {
                throw new GradleException("Tests failed with exit code: $testExitCode")
            }
        } finally {
            // Kill the client process
            clientProcess.destroyForcibly()
            clientProcess.waitFor(5, TimeUnit.SECONDS)
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
compileJava.dependsOn spotlessApply

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.21 uses Java 21.
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    from {
        configurations.compileClasspath.findAll {
            (it.name.endsWith('jar') && it.name.contains('org.eclipse.paho.client.mqttv3'))
        }
    }.collect {
        zipTree(it)
    }
}

spotless {
    java {
        removeUnusedImports()
        leadingSpacesToTabs()
        trimTrailingWhitespace()
        eclipse().configFile(file("codestyle/formatter.xml"))
    }
    json {
        target("src/**/*.json", "src/**/*.mcmeta")
        gson().indentWithSpaces(2).version("2.11.0")
    }
}

test {
    useJUnitPlatform()
}


tasks.register("runProductionClientGameTest", ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    // Whether to use XVFB to run the game, using a virtual framebuffer. This is useful for headless CI environments.
    // Defaults to true only on Linux and when the "CI" environment variable is set.
    // XVFB must be installed, on Debian-based systems you can install it with: `apt install xvfb`
    useXVFB = true
}

