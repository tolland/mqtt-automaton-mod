---
# Modular Bot Client Configuration Example
# This demonstrates the behavior-based architecture for handling events

# Bot identification
client_id: SandyFire
expected_player_name: SandyFire

# MQTT broker settings
broker: 127.0.0.1
port: 1883

# Optional behavior tuning
timeout_seconds: 300
max_retries: 2
retry_delay_seconds: 3

# Inventory Management Behavior Configuration
inventory_management:
  priority: 2  # Higher priority than farming (lower number = higher priority)
  interruptible: false  # Don't interrupt during trading

  # Warp configuration
  warp_command: "warp merchants"
  merchant_location:
    # Approximate location after warp (if known)
    x: 100
    y: 64
    z: 200
    radius: 10

  # NPC Navigation (uses baritone)
  navigate_to_npc: true
  npc_coordinates:
    x: 105
    y: 64
    z: 195

# Farming waypoints (for FarmingBehavior)
waypoints:
  - x: 18
    y: 65
    z: -8
    run: [cane_row_01]

  - x: 21
    y: 65
    z: -110
    run: [cane_row_02]

# Patterns for farming
patterns:
  cane_row_01:
    - "~ ~ ~-5"
    - "~ ~ ~-5"
    - "~ ~ ~-5"
    - "~ ~ ~-5"

  cane_row_02:
    - "~ ~ ~5"
    - "~ ~ ~5"
    - "~ ~ ~5"
    - "~ ~ ~5"

# Service definitions (for MQTT command handling)
services:
  baritone:
    commands:
      pause: { type: "no-reply" }
      resume: { type: "no-reply" }
      goto: { type: "reply-expected", timeout: 60 }
  warp:
    commands:
      teleport:
        type: "reply-expected"
        timeout: 15
  wurst:
    commands:
      command: { type: "reply-expected", timeout: 5 }
  inventory:
    # Inventory service is handled by the mod
