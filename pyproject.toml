[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqttbot"
version = "0.1.0"
description = "MQTT-based Minecraft bot automation with Baritone integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mqtt-automaton-mod contributors"}
]
keywords = ["minecraft", "mqtt", "automation", "baritone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "paho-mqtt>=1.6.1,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.9.0,<1.0",
    "rich>=13.0.0,<14.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mqttbot = "mqttbot.cli:app"

[project.urls]
Homepage = "https://github.com/tolland/mqtt-automaton-mod"
Repository = "https://github.com/tolland/mqtt-automaton-mod"
Issues = "https://github.com/tolland/mqtt-automaton-mod/issues"

[tool.hatch.build.targets.wheel]
packages = ["src-py/mqttbot"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
pythonpath = ["src-py"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_client",
]
